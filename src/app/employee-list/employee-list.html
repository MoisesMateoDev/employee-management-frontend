<div class="container mt-4">

    <h1 class="text-center">
        Get above to learn about the Employees
        <br>
        <br>
        Webpage in
    <h1 class="text-warning">{{ maintenance }} </h1>
    </h1>

    <h2 class="text-center mb-4">Employee List</h2>

    <div class="table-responsive">

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                @for (employee of employees(); track employee.id) {
                    <tr>
                        <td>{{ employee.firstName }}</td>
                        <td>{{ employee.lastName }}</td>
                        <td>{{ employee.emailId }}</td>
                        <td>
                            <button (click)="updateEmployee(employee.id)" class="btn btn-info"> Update </button>
                            <button (click)="deleteEmployee(employee.id)" class="btn btn-danger"> Delete </button>
                            <button (click)="viewEmployeeDetails(employee)" class="btn btn-warning"> View </button>
                        </td>
                    </tr>
                }
            </tbody>
        </table>

    </div>

</div>
